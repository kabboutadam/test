# Fly.io config for the BusMapp API. Run from the server/ directory.
#   fly launch --no-deploy      (creates the app; keep this fly.toml)
#   fly postgres create         (then: fly postgres attach <db> — sets DATABASE_URL)
#   fly secrets set USE_PRISMA=true SEED_ON_START=true JWT_SECRET=$(openssl rand -hex 32)
#   fly deploy
app = "busmapp-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
