# Render blueprint: deploys the BusMapp API + a Postgres database.
# In Render: New → Blueprint → point at this repo. It reads this file.
services:
  - type: web
    name: busmapp-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_PRISMA
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: busmapp-db
          property: connectionString

databases:
  - name: busmapp-db
    plan: free
