# Render blueprint: deploys the BusMapp API + a Postgres database.
# In Render: New → Blueprint → point at this repo. It reads this file.
services:
  - type: web
    name: busmapp-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    # 'starter' keeps the instance always-on (no free-tier spin-down / ~50s cold
    # start). Required before real families rely on it. Changing this line only
    # affects fresh Blueprint deploys — upgrade the already-running service in the
    # Render dashboard (Settings → Instance Type → Starter).
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_PRISMA
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: busmapp-db
          property: connectionString
      # Your phone(s) as platform owner — you enter this in the Render dashboard
      # (comma-separated). Only these numbers can create schools + logins.
      - key: SUPERADMIN_PHONES
        sync: false
      # SMS for login codes. 'console' returns the code in the response — fine for
      # YOUR first smoke test, but switch to 'twilio' (+ the vars below) before
      # inviting real schools/parents, or anyone could log in as a known number.
      - key: SMS_PROVIDER
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false

databases:
  - name: busmapp-db
    # NOTE: Render DELETES free databases after 90 days — upgrade to a paid tier
    # in the Render dashboard (busmapp-db → your plan) before storing real data,
    # or you'll lose all schools/kids/parents at the 90-day mark.
    plan: free
